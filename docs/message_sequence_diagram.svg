<svg width="1100" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1100" height="800" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="550" y="35" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    RPC Message Sequence (Loan Approval Example)
  </text>

  <!-- Actors -->
  <rect x="50" y="70" width="150" height="40" fill="#0288d1" stroke="#01579b" stroke-width="2" rx="3"/>
  <text x="125" y="97" font-size="12" font-weight="bold" text-anchor="middle" fill="white">BaleBot (Publisher)</text>

  <rect x="300" y="70" width="150" height="40" fill="#e65100" stroke="#bf360c" stroke-width="2" rx="3"/>
  <text x="375" y="97" font-size="12" font-weight="bold" text-anchor="middle" fill="white">RabbitMQ</text>

  <rect x="550" y="70" width="150" height="40" fill="#2e7d32" stroke="#1b5e20" stroke-width="2" rx="3"/>
  <text x="625" y="97" font-size="12" font-weight="bold" text-anchor="middle" fill="white">FastAPI (Consumer)</text>

  <rect x="800" y="70" width="150" height="40" fill="#7b1fa2" stroke="#4a148c" stroke-width="2" rx="3"/>
  <text x="875" y="97" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Database</text>

  <!-- Vertical timelines -->
  <line x1="125" y1="110" x2="125" y2="770" stroke="#0288d1" stroke-width="1" stroke-dasharray="2,4"/>
  <line x1="375" y1="110" x2="375" y2="770" stroke="#e65100" stroke-width="1" stroke-dasharray="2,4"/>
  <line x1="625" y1="110" x2="625" y2="770" stroke="#2e7d32" stroke-width="1" stroke-dasharray="2,4"/>
  <line x1="875" y1="110" x2="875" y2="770" stroke="#7b1fa2" stroke-width="1" stroke-dasharray="2,4"/>

  <!-- Time markers -->
  <text x="50" y="155" font-size="10" fill="#999">T1</text>
  <circle cx="125" cy="150" r="3" fill="#0288d1"/>
  <text x="140" y="155" font-size="10" fill="#333">Admin clicks approve button</text>

  <text x="50" y="200" font-size="10" fill="#999">T2</text>
  <!-- Publisher creates request -->
  <path d="M 135 195 L 365 220" stroke="#0288d1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="210" font-size="9" fill="#0288d1">1. Publish Message</text>
  <text x="140" y="235" font-size="9" fill="#333">correlation_id: uuid-1234</text>
  <text x="140" y="250" font-size="9" fill="#333">reply_to: amq.gen-xyz</text>

  <text x="50" y="290" font-size="10" fill="#999">T3</text>
  <!-- Consumer receives -->
  <circle cx="625" cy="285" r="3" fill="#2e7d32"/>
  <path d="M 365 280 L 615 290" stroke="#e65100" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="275" font-size="9" fill="#e65100">2. Consumer Route</text>

  <text x="50" y="330" font-size="10" fill="#999">T4</text>
  <!-- Service processes -->
  <circle cx="625" cy="325" r="3" fill="#2e7d32"/>
  <text x="640" y="330" font-size="9" fill="#333">3. LoanService.approve()</text>

  <text x="50" y="375" font-size="10" fill="#999">T5</text>
  <!-- DB queries -->
  <path d="M 635 370 L 865 390" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="750" y="385" font-size="9" fill="#2e7d32">4. Query & Update</text>

  <text x="50" y="425" font-size="10" fill="#999">T6</text>
  <!-- DB response -->
  <circle cx="875" cy="420" r="3" fill="#7b1fa2"/>
  <path d="M 865 425 L 635 440" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="750" y="435" font-size="9" fill="#7b1fa2">5. Commit OK</text>

  <text x="50" y="480" font-size="10" fill="#999">T7</text>
  <!-- Service publishes response -->
  <circle cx="625" cy="475" r="3" fill="#2e7d32"/>
  <text x="640" y="480" font-size="9" fill="#333">6. Serialize Response</text>

  <text x="50" y="525" font-size="10" fill="#999">T8</text>
  <!-- Publish to reply_to -->
  <path d="M 635 520 L 365 540" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="535" font-size="9" fill="#2e7d32">7. Publish to reply_to</text>

  <text x="50" y="575" font-size="10" fill="#999">T9</text>
  <!-- Publisher receives response -->
  <path d="M 365 570 L 135 590" stroke="#e65100" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="565" font-size="9" fill="#e65100">8. Consumer response</text>

  <text x="50" y="625" font-size="10" fill="#999">T10</text>
  <!-- Callback triggered -->
  <circle cx="125" cy="620" r="3" fill="#0288d1"/>
  <text x="140" y="625" font-size="9" fill="#333">9. Match correlation_id</text>

  <text x="50" y="670" font-size="10" fill="#999">T11</text>
  <!-- Async callback -->
  <circle cx="125" cy="665" r="3" fill="#0288d1"/>
  <text x="140" y="670" font-size="9" fill="#333">10. Run asyncio callback</text>

  <text x="50" y="715" font-size="10" fill="#999">T12</text>
  <!-- Send response to user -->
  <circle cx="125" cy="710" r="3" fill="#0288d1"/>
  <text x="140" y="715" font-size="9" fill="#333">11. Send to member chat</text>

  <!-- Legend box -->
  <rect x="50" y="745" width="1000" height="45" fill="#fff3e0" stroke="#e65100" stroke-width="1" rx="3"/>
  <text x="60" y="763" font-size="10" font-weight="bold" fill="#bf360c">RPC Flow Timeline (Total ~0.2-0.5s with RabbitMQ/DB latency):</text>
  <text x="60" y="780" font-size="9" fill="#333">Sync: Bot blocks until response. Callback runs after response matched. Default timeout: 0.2s → returns None if exceeded.</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#555"/>
    </marker>
  </defs>
</svg>