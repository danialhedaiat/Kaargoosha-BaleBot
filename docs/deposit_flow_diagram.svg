<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="1000" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Deposit (Charge Wallet) Flow
  </text>

  <!-- Member Column -->
  <text x="150" y="75" font-size="14" font-weight="bold" fill="#01579b">Member</text>
  <line x1="150" y1="85" x2="150" y2="980" stroke="#0288d1" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Bot Column -->
  <text x="500" y="75" font-size="14" font-weight="bold" fill="#7b1fa2">BaleBot</text>
  <line x1="500" y1="85" x2="500" y2="980" stroke="#7b1fa2" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- FastAPI Column -->
  <text x="850" y="75" font-size="14" font-weight="bold" fill="#2e7d32">FastAPI Backend</text>
  <line x1="850" y1="85" x2="850" y2="980" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Step 1: Member taps button -->
  <circle cx="150" cy="120" r="4" fill="#0288d1"/>
  <text x="160" y="125" font-size="11" fill="#333">Taps "شارژ کیف پول"</text>

  <!-- Bot asks for amount -->
  <path d="M 160 140 L 490 170" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="500" cy="180" r="4" fill="#7b1fa2"/>
  <text x="510" y="185" font-size="11" fill="#333">Asks for amount</text>

  <!-- Message back -->
  <path d="M 490 200 L 160 230" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="215" font-size="9" fill="#7b1fa2" text-anchor="end">لطفا مبلغ را وارد کنید</text>

  <!-- Step 2: Member enters amount -->
  <circle cx="150" cy="240" r="4" fill="#0288d1"/>
  <text x="160" y="245" font-size="11" fill="#333">Enters: 1000000</text>

  <!-- Validation -->
  <rect x="450" y="260" width="100" height="50" fill="#e3f2fd" stroke="#0288d1" stroke-width="1" rx="3"/>
  <text x="500" y="280" font-size="9" font-weight="bold" text-anchor="middle">Validation:</text>
  <text x="500" y="298" font-size="8" text-anchor="middle">Numeric? Positive?</text>

  <!-- Step 3: Ask for proof -->
  <circle cx="500" cy="330" r="4" fill="#7b1fa2"/>
  <text x="510" y="335" font-size="11" fill="#333">Asks for proof</text>

  <!-- Message back -->
  <path d="M 490 350 L 160 380" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="365" font-size="9" fill="#7b1fa2" text-anchor="end">لطفا فیش/رسید ارسال کنید</text>

  <!-- Two paths: Photo or Text -->
  <text x="150" y="410" font-size="11" font-weight="bold" fill="#333">Two Options:</text>

  <!-- Path 1: Photo -->
  <rect x="50" y="430" width="200" height="180" fill="#fff3e0" stroke="#e65100" stroke-width="1" rx="3"/>
  <text x="150" y="450" font-size="11" font-weight="bold" text-anchor="middle">Path 1: Photo Proof</text>

  <circle cx="150" cy="480" r="3" fill="#0288d1"/>
  <text x="160" y="485" font-size="10" fill="#333">Sends photo</text>

  <path d="M 160 495 L 480 520" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="500" cy="530" r="3" fill="#7b1fa2"/>
  <text x="510" y="535" font-size="10" fill="#333">photo_listener()</text>

  <path d="M 510 545 L 840 570" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="850" cy="580" r="3" fill="#2e7d32"/>
  <text x="860" y="585" font-size="10" fill="#333">RPC deposit.create()</text>
  <text x="860" y="600" font-size="9" fill="#333" font-style="italic">proof_type: "photo"</text>

  <!-- Path 2: Text -->
  <rect x="320" y="430" width="200" height="180" fill="#e3f2fd" stroke="#0288d1" stroke-width="1" rx="3"/>
  <text x="420" y="450" font-size="11" font-weight="bold" text-anchor="middle">Path 2: Text Proof</text>

  <circle cx="420" cy="480" r="3" fill="#0288d1"/>
  <text x="430" y="485" font-size="10" fill="#333">Sends text</text>
  <text x="420" y="500" font-size="9" fill="#333">رسید شماره ۱۲۳</text>

  <path d="M 430 510 L 500 530" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="500" cy="540" r="3" fill="#7b1fa2"/>
  <text x="510" y="545" font-size="10" fill="#333">text_listener()</text>

  <path d="M 510 555 L 840 580" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Both merge -->
  <rect x="750" y="610" width="180" height="60" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" rx="3"/>
  <text x="840" y="630" font-size="10" font-weight="bold" text-anchor="middle">Backend:</text>
  <text x="760" y="648" font-size="9">✓ Create DepositRequest</text>
  <text x="760" y="663" font-size="9">✓ status = pending</text>

  <!-- Notify admins -->
  <circle cx="850" cy="690" r="3" fill="#2e7d32"/>
  <text x="860" y="695" font-size="10" fill="#333">Notify admins</text>

  <!-- Response back -->
  <path d="M 840 710 L 170 740" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="480" y="720" width="160" height="30" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" rx="3"/>
  <text x="560" y="740" font-size="9" fill="#2e7d32" text-anchor="middle">{id, status: pending}</text>

  <!-- Confirmation to member -->
  <circle cx="150" cy="760" r="3" fill="#0288d1"/>
  <text x="160" y="765" font-size="10" fill="#333">Sees confirmation</text>

  <!-- Message -->
  <path d="M 160 775 L 490 805" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="500" cy="815" r="3" fill="#7b1fa2"/>
  <text x="510" y="820" font-size="10" fill="#333">Shows message</text>

  <!-- Message back -->
  <path d="M 490 835 L 160 860" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="840" width="240" height="35" fill="#fff3e0" stroke="#e65100" stroke-width="1" rx="3"/>
  <text x="320" y="862" font-size="9" text-anchor="middle">درخواست شارژ ثبت شد ✅</text>
  <text x="320" y="874" font-size="8" text-anchor="middle">در انتظار تایید ادمین</text>

  <!-- Admin notification (Async) -->
  <rect x="630" y="870" width="220" height="90" fill="#fff3e0" stroke="#e65100" stroke-width="2" rx="5"/>
  <text x="740" y="890" font-size="10" font-weight="bold" text-anchor="middle">Admin Notification</text>
  <text x="740" y="910" font-size="9" text-anchor="middle">(notify.deposit_request)</text>

  <rect x="650" y="925" width="180" height="25" fill="#fff" stroke="#e65100" stroke-width="1" rx="2"/>
  <text x="740" y="942" font-size="8" text-anchor="middle">[✅ تایید] [❌ رد کردن]</text>

  <!-- Arrow from backend to admin -->
  <path d="M 850 690 L 780 880" stroke="#e65100" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowDash)"/>

  <!-- Legend -->
  <rect x="50" y="960" width="900" height="25" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="3"/>
  <text x="60" y="977" font-size="9" fill="#333">→ Synchronous (RPC) | ⇢ Asynchronous (Notification) | ◇ State Check</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#555"/>
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#e65100"/>
    </marker>
  </defs>
</svg>