<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820">
  <rect width="1120" height="820" fill="#f8f9fa"/>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#455a64"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="560" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RPC Message Sequence (Loan Approval)</text>

  <!-- Actor headers -->
  <rect x="60" y="70" width="170" height="42" fill="#0288d1" stroke="#01579b" stroke-width="2" rx="4"/>
  <text x="145" y="97" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">BaleBot Publisher</text>

  <rect x="330" y="70" width="170" height="42" fill="#e65100" stroke="#bf360c" stroke-width="2" rx="4"/>
  <text x="415" y="97" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">RabbitMQ</text>

  <rect x="600" y="70" width="190" height="42" fill="#2e7d32" stroke="#1b5e20" stroke-width="2" rx="4"/>
  <text x="695" y="97" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">FastAPI Consumer</text>

  <rect x="890" y="70" width="170" height="42" fill="#7b1fa2" stroke="#4a148c" stroke-width="2" rx="4"/>
  <text x="975" y="97" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Database</text>

  <!-- Lifelines -->
  <line x1="145" y1="112" x2="145" y2="770" stroke="#0288d1" stroke-width="1.5" stroke-dasharray="3,4"/>
  <line x1="415" y1="112" x2="415" y2="770" stroke="#e65100" stroke-width="1.5" stroke-dasharray="3,4"/>
  <line x1="695" y1="112" x2="695" y2="770" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="3,4"/>
  <line x1="975" y1="112" x2="975" y2="770" stroke="#7b1fa2" stroke-width="1.5" stroke-dasharray="3,4"/>

  <!-- Step 1 -->
  <circle cx="145" cy="150" r="4" fill="#0288d1"/>
  <text x="155" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#333">Admin enters loan amount</text>

  <!-- 1. publish -->
  <path d="M 150 175 L 410 175" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#01579b" text-anchor="middle">1. publish loan.approve</text>
  <text x="280" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">correlation_id + reply_to set</text>

  <!-- 2. route to consumer -->
  <path d="M 420 220 L 690 220" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="555" y="213" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#bf360c" text-anchor="middle">2. route by topic key</text>

  <!-- 3. service -->
  <circle cx="695" cy="250" r="4" fill="#2e7d32"/>
  <text x="705" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#333">3. LoanService.approve()</text>

  <rect x="600" y="270" width="190" height="78" fill="#fff3e0" stroke="#e65100" stroke-width="1" rx="4"/>
  <text x="695" y="289" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#bf360c">Validations</text>
  <text x="612" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#333">status == pending</text>
  <text x="612" y="321" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#333">amount &lt;= LOAN_MAX_AMOUNT</text>
  <text x="612" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#333">fund_pool.balance &gt;= amount</text>

  <!-- 4. db update -->
  <path d="M 705 375 L 970 375" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="840" y="368" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2e7d32" text-anchor="middle">4. update + insert</text>
  <text x="840" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">loan, fund_pool, account, transaction, installments</text>

  <!-- 5. commit ok -->
  <path d="M 970 420 L 705 420" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="840" y="413" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#7b1fa2" text-anchor="middle">5. commit ok</text>

  <!-- 6. serialize -->
  <circle cx="695" cy="450" r="4" fill="#2e7d32"/>
  <text x="705" y="445" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#333">6. serialize JSON response</text>

  <!-- 7. publish to reply_to -->
  <path d="M 690 480 L 420 480" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="555" y="473" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#2e7d32" text-anchor="middle">7. publish to reply_to</text>

  <!-- 8. deliver response -->
  <path d="M 410 520 L 150 520" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="513" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#bf360c" text-anchor="middle">8. deliver response</text>
  <text x="280" y="540" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">same correlation_id</text>

  <!-- 9. match -->
  <circle cx="145" cy="565" r="4" fill="#0288d1"/>
  <text x="155" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#333">9. match correlation_id</text>

  <!-- 10. callback -->
  <circle cx="145" cy="595" r="4" fill="#0288d1"/>
  <text x="155" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#333">10. run async callback (after_loan_approve)</text>

  <!-- 11. reply to admin -->
  <circle cx="145" cy="625" r="4" fill="#0288d1"/>
  <text x="155" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#333">11. reply to admin chat: loan approved</text>

  <!-- Async note -->
  <rect x="600" y="600" width="430" height="56" fill="#ffe0b2" stroke="#e65100" stroke-width="1.5" rx="5"/>
  <text x="615" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#bf360c">In parallel (async, not RPC):</text>
  <text x="615" y="638" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#333">notify.loan_approved is published, Consumer pushes</text>
  <text x="615" y="651" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#333">the approval message straight to the member chat.</text>

  <!-- Legend -->
  <rect x="60" y="690" width="1000" height="70" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="5"/>
  <text x="72" y="712" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Notes</text>
  <text x="72" y="732" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#333">The Publisher blocks until a response with the matching correlation_id arrives. Default timeout is 0.2s.</text>
  <text x="72" y="750" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#333">If the timeout elapses, response is None and the callback shows a generic error to the user.</text>
</svg>