<svg width="1000" height="1200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="1200" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Loan Application Flow
  </text>

  <!-- Member Column -->
  <text x="150" y="75" font-size="14" font-weight="bold" fill="#01579b">Member</text>
  <line x1="150" y1="85" x2="150" y2="1180" stroke="#0288d1" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Bot Column -->
  <text x="500" y="75" font-size="14" font-weight="bold" fill="#7b1fa2">BaleBot</text>
  <line x1="500" y1="85" x2="500" y2="1180" stroke="#7b1fa2" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- FastAPI Column -->
  <text x="850" y="75" font-size="14" font-weight="bold" fill="#2e7d32">FastAPI Backend</text>
  <line x1="850" y1="85" x2="850" y2="1180" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Step 1 -->
  <circle cx="150" cy="120" r="4" fill="#0288d1"/>
  <text x="160" y="125" font-size="11" fill="#333">Taps "درخواست وام"</text>

  <!-- Message -->
  <path d="M 160 135 L 490 160" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="150" font-size="9" fill="#7b1fa2">apply_for_loan()</text>

  <!-- Step 2 -->
  <circle cx="500" cy="170" r="4" fill="#7b1fa2"/>
  <text x="510" y="175" font-size="11" fill="#333">Shows duration buttons</text>

  <!-- Message -->
  <path d="M 490 190 L 160 220" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="205" font-size="9" fill="#7b1fa2" text-anchor="end">Buttons: 6/12/15 months</text>

  <!-- Step 3 -->
  <circle cx="150" cy="230" r="4" fill="#0288d1"/>
  <text x="160" y="235" font-size="11" fill="#333">Selects "۱۲ ماه"</text>

  <!-- Message -->
  <path d="M 160 250 L 490 280" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="265" font-size="9" fill="#7b1fa2">loan_duration_selected(12)</text>

  <!-- Step 4 -->
  <circle cx="500" cy="290" r="4" fill="#7b1fa2"/>
  <text x="510" y="295" font-size="11" fill="#333">Confirms in summary</text>

  <!-- Message -->
  <path d="M 490 310 L 160 340" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="325" font-size="9" fill="#7b1fa2" text-anchor="end">Confirm or Cancel</text>

  <!-- Step 5 -->
  <circle cx="150" cy="350" r="4" fill="#0288d1"/>
  <text x="160" y="355" font-size="11" fill="#333">Taps "✅ تایید"</text>

  <!-- RPC Request -->
  <path d="M 160 370 L 840 420" stroke="#7b1fa2" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="480" y="390" width="200" height="25" fill="#e3f2fd" stroke="#7b1fa2" stroke-width="1" rx="3"/>
  <text x="580" y="407" font-size="9" fill="#01579b" text-anchor="middle">RPC: loan.create()</text>

  <!-- Step 6 - FastAPI -->
  <circle cx="850" cy="430" r="4" fill="#2e7d32"/>
  <text x="860" y="435" font-size="11" fill="#333">LoanService.create()</text>

  <!-- Validation checks -->
  <rect x="850" y="455" width="130" height="70" fill="#fff3e0" stroke="#e65100" stroke-width="1" rx="3"/>
  <text x="915" y="475" font-size="9" font-weight="bold" text-anchor="middle">Validations:</text>
  <text x="860" y="490" font-size="8">✓ No active loan</text>
  <text x="860" y="505" font-size="8">✓ Balance ≥ threshold</text>
  <text x="860" y="520" font-size="8">✓ Amount ≤ max</text>

  <!-- DB Write -->
  <circle cx="850" cy="540" r="4" fill="#2e7d32"/>
  <text x="860" y="545" font-size="11" fill="#333">Loan(status=pending)</text>

  <!-- Notify -->
  <circle cx="850" cy="570" r="4" fill="#2e7d32"/>
  <text x="860" y="575" font-size="11" fill="#333">Notify admins</text>

  <!-- RPC Response -->
  <path d="M 840 590 L 170 630" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="480" y="605" width="200" height="25" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" rx="3"/>
  <text x="580" y="622" font-size="9" fill="#2e7d32" text-anchor="middle">Response: {id, status}</text>

  <!-- Step 7 -->
  <circle cx="150" cy="640" r="4" fill="#0288d1"/>
  <text x="160" y="645" font-size="11" fill="#333">Sees confirmation</text>

  <!-- Message -->
  <path d="M 160 660 L 490 690" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="675" font-size="9" fill="#7b1fa2">callback: after_loan_create()</text>

  <!-- Step 8 -->
  <circle cx="500" cy="700" r="4" fill="#7b1fa2"/>
  <text x="510" y="705" font-size="11" fill="#333">Shows confirmation</text>

  <!-- Message -->
  <path d="M 490 720 L 160 750" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="735" font-size="9" fill="#7b1fa2" text-anchor="end">درخواست شما ثبت شد ✅</text>

  <!-- Admin Notification (Async) -->
  <rect x="500" y="780" width="180" height="60" fill="#fff3e0" stroke="#e65100" stroke-width="2" rx="5"/>
  <text x="590" y="800" font-size="10" font-weight="bold" text-anchor="middle">Admin Notification</text>
  <text x="590" y="820" font-size="9" text-anchor="middle">(notify.loan_request)</text>
  <text x="590" y="835" font-size="8" text-anchor="middle">Shows approve/reject buttons</text>

  <!-- Arrow from FastAPI to Admin -->
  <path d="M 850 570 L 780 810" stroke="#e65100" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowDash)"/>

  <!-- Admin Approval Path -->
  <text x="150" y="880" font-size="13" font-weight="bold" fill="#333">Admin Approval:</text>

  <!-- Step: Admin taps approve -->
  <rect x="50" y="900" width="200" height="50" fill="#e3f2fd" stroke="#0288d1" stroke-width="1" rx="3"/>
  <text x="150" y="920" font-size="10" font-weight="bold" text-anchor="middle">Admin taps</text>
  <text x="150" y="937" font-size="10" font-weight="bold" text-anchor="middle">✅ Approve</text>

  <!-- Arrow -->
  <path d="M 250 925 L 480 925" stroke="#0288d1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step: Ask amount -->
  <rect x="480" y="900" width="200" height="50" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1" rx="3"/>
  <text x="580" y="920" font-size="10" font-weight="bold" text-anchor="middle">Bot asks for</text>
  <text x="580" y="937" font-size="10" font-weight="bold" text-anchor="middle">amount in تومان</text>

  <!-- Arrow -->
  <path d="M 680 925 L 850 925" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step: Admin enters amount -->
  <rect x="850" y="900" width="120" height="50" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" rx="3"/>
  <text x="910" y="920" font-size="10" font-weight="bold" text-anchor="middle">Admin enters</text>
  <text x="910" y="937" font-size="10" font-weight="bold" text-anchor="middle">5,000,000</text>

  <!-- RPC to approve -->
  <path d="M 850 950 L 690 1000" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="750" y="970" width="150" height="25" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" rx="3"/>
  <text x="825" y="987" font-size="9" fill="#2e7d32" text-anchor="middle">RPC: loan.approve()</text>

  <!-- Backend processes -->
  <rect x="480" y="1010" width="200" height="85" fill="#fff3e0" stroke="#e65100" stroke-width="1" rx="3"/>
  <text x="580" y="1030" font-size="9" font-weight="bold" text-anchor="middle">Backend:</text>
  <text x="500" y="1047" font-size="8">✓ Set loan.amount</text>
  <text x="500" y="1062" font-size="8">✓ Debit FundPool</text>
  <text x="500" y="1077" font-size="8">✓ Credit Account</text>
  <text x="500" y="1092" font-size="8">✓ Generate Installments</text>

  <!-- Final confirmation -->
  <circle cx="150" cy="1120" r="4" fill="#0288d1"/>
  <text x="160" y="1125" font-size="11" fill="#333">Member notified of approval</text>

  <!-- Legend -->
  <rect x="50" y="1150" width="900" height="35" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="3"/>
  <text x="60" y="1168" font-size="9" fill="#333">→ Synchronous (RPC with response) | ⇢ Asynchronous (Notification) | ◇ Decision Point</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#555"/>
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#e65100"/>
    </marker>
  </defs>
</svg>